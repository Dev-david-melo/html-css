<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
  
    <header>      
            <div class="logo">
                <i class="fa-solid fa-bolt"></i>
                <h1>TechStore</h1>
            </div>
            <div class="cabeçalho">
                <input placeholder="Buscar produtos" class="cabeçalho-input">
                
               <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            
    </header>
    <div class="categoria-produtos">
          <nav class="categoria-nav">
            <button class="categoria-btn ativo">
           <i class="fa-solid fa-border-all"></i>
           Todos
            </button>

            <button class="categoria-btn">
                <i class="fa-solid fa-mobile"></i>
                Smartphones
            </button>

            <button class="categoria-btn">
                    <i class="fa-solid fa-laptop"></i>
                    Notebooks
            </button>

            <button class="categoria-btn">
                <i class="fa-solid fa-headphones" ></i>
                Fones de Ouvido
            </button>

            <button class="categoria-btn">
                <i class="fa-regular fa-keyboard"></i>
                Acessórios
            </button>

            <button class="categoria-btn">
                <i class="fa-solid fa-clock"></i>
                Smartwatches
            </button>

          </nav>
    </div>

        <section class="banner">
            <h2>Black Friday Antecipada!</h2>
            <p>Até 50% de descontos em produtos selecionados</p>
           
        </section>
  

    <main class="produt">
        <div class="produtos-cont">
        </div>
    </main>
    
    <footer>
        <p>&copy; 2025 TechStore. Todos os direitos reservados.</p>
        <div>
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-instagram"></i>
        </div>
    </footer>
</body>
<script src="scripts.js">

</script>
        
</html>
